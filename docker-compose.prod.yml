services:
  db:
    image: postgres:16-alpine
    container_name: ai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cms}
      POSTGRES_USER: ${POSTGRES_USER:-cms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cms} -d ${POSTGRES_DB:-cms}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEBUG: ${DJANGO_DEBUG:-0}
      SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me}
      ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-ai4businesss.com,www.ai4businesss.com,82.97.252.28,127.0.0.1,localhost}
      DATABASE_URL: ${DJANGO_DATABASE_URL:-postgresql://cms:cms@db:5432/cms}
      CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-https://ai4businesss.com,https://www.ai4businesss.com,http://82.97.252.28,https://82.97.252.28}
      CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://ai4businesss.com,https://www.ai4businesss.com,http://ai4businesss.com,http://www.ai4businesss.com,http://82.97.252.28,https://82.97.252.28}
      STATIC_URL: ${DJANGO_STATIC_URL:-/static/}
      STATIC_ROOT: ${DJANGO_STATIC_ROOT:-/app/staticfiles}
      MEDIA_URL: ${DJANGO_MEDIA_URL:-/media/}
      MEDIA_ROOT: ${DJANGO_MEDIA_ROOT:-/app/media}
      USE_X_FORWARDED_HOST: ${DJANGO_USE_X_FORWARDED_HOST:-1}
      USE_X_FORWARDED_PROTO: ${DJANGO_USE_X_FORWARDED_PROTO:-1}
      CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-0}
      SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-0}
      SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-0}
      SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:-0}
      SECURE_HSTS_PRELOAD: ${DJANGO_SECURE_HSTS_PRELOAD:-0}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /var/www/ai/static:/app/staticfiles
      - /var/www/ai/media:/app/media
    command: >
      sh -c "python manage.py migrate
      && python manage.py collectstatic --noinput
      && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3} --timeout ${GUNICORN_TIMEOUT:-120}"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://backend:8000}
        VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:-https://ai4businesss.com}
        VITE_TRACKNODE_API_KEY: ${VITE_TRACKNODE_API_KEY:-}
        VITE_TRACKNODE_TRACKER_SRC: ${VITE_TRACKNODE_TRACKER_SRC:-https://tracknode.ru/tracker.js}
    container_name: ai-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data: